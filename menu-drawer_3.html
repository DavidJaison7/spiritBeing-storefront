<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SpiritBeing — menu drawer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* ===========================================================
   SPIRITBEING — SLIDE-IN MENU DRAWER
   Timings measured off the reference recording:
     open  ~380ms, slides in from the right with a small overshoot
     close ~200ms, accelerates back out
     panel #202020, 24px radius, inset from the screen edges
   =========================================================== */
:root{
  --void:#000;--panel:#202020;--panel-2:#2A2A2C;--line:#343437;
  --chrome:#fff;--ash:#9A9DA5;--steel:#6B6E77;--electric:#1B3CF5;
  --hdr:64px;
  /* the menu typeface. swap to 'Space Grotesk' for the squarer, quirkier cut */
  --font-ui:'Plus Jakarta Sans','Archivo','Helvetica Neue',Arial,sans-serif;
  --in:cubic-bezier(.22,1.06,.36,1);      /* open: decelerate, slight overshoot */
  --out:cubic-bezier(.55,0,.85,.35);      /* close: accelerate away */
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--void);color:var(--chrome);
  font-family:"Archivo","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body.menu-open{overflow:hidden}

/* ---------------- header (transparent over the hero) ---------------- */
.sb-header{
  position:fixed;top:0;left:0;right:0;z-index:90;height:var(--hdr);
  display:flex;align-items:center;padding:0 clamp(16px,2.4vw,34px);
  color:#fff;
}
.sb-header{pointer-events:none}
.sb-header a,.sb-header button{pointer-events:auto}
body.menu-open .sb-nav-l,
body.menu-open .sb-nav-r .sb-link{opacity:0;pointer-events:none;transition:opacity .3s ease}
.sb-nav-l,.sb-nav-r{display:flex;align-items:center;gap:clamp(14px,1.9vw,30px)}
.sb-nav-r{margin-left:auto}
.sb-link{
  background:none;border:0;padding:0;cursor:pointer;color:inherit;font-family:inherit;
  font-size:13px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  text-decoration:none;white-space:nowrap;opacity:.92;transition:opacity .3s ease;
}
.sb-link:hover{opacity:1}
.sb-link .caret{font-size:8px;margin-left:5px;vertical-align:2px}

/* ---------------------------------------------------------------
   THE BURGER — one control, three states.

     closed            three bars. hover does nothing to the shape.
     open              the bars fold into a cross.
     open + hover      the cross spins a half turn.

   It sits above the drawer (z-index 90) so it stays reachable once
   the panel is over it — that is what makes the hover-spin possible
   and why there is no second close button.
   --------------------------------------------------------------- */
.sb-burger{
  position:relative;z-index:90;
  width:44px;height:44px;display:grid;place-items:center;
  background:none;border:0;cursor:pointer;padding:0;color:#fff;
  -webkit-tap-highlight-color:transparent;
}
.sb-burger .bars{
  position:relative;width:22px;height:15px;
  transition:transform .5s var(--in);
}
.sb-burger i{
  position:absolute;left:0;height:2px;background:currentColor;border-radius:2px;
  transition:transform .46s var(--in), width .46s var(--in), opacity .22s ease;
}
.sb-burger i:nth-child(1){top:0;width:100%}
.sb-burger i:nth-child(2){top:7px;width:100%}
.sb-burger i:nth-child(3){top:14px;width:62%}      /* the short one */

/* closed + hover: the stack expands outward — tighten, inverted.
   Top bar lifts, bottom bar drops, middle holds the centre, and the
   short bar squares up. Scoped to the closed state so it never fights
   the cross once the drawer is open. */
.sb-burger:not([aria-expanded="true"]):hover i:nth-child(1),
.sb-burger:not([aria-expanded="true"]):focus-visible i:nth-child(1){transform:translateY(-3px)}

.sb-burger:not([aria-expanded="true"]):hover i:nth-child(3),
.sb-burger:not([aria-expanded="true"]):focus-visible i:nth-child(3){
  transform:translateY(3px);width:100%;
}

/* open: the stack spins a half turn while the bars fold into the cross.
   The rotation is what carries them through the tilted in-between angles
   instead of just folding shut. ~460ms, matching the reference. */
.sb-burger[aria-expanded="true"] .bars{transform:rotate(180deg)}

/* open: fold into the cross */
.sb-burger[aria-expanded="true"] i:nth-child(1){transform:translateY(7px) rotate(45deg)}
.sb-burger[aria-expanded="true"] i:nth-child(2){opacity:0;transform:scaleX(.15)}
.sb-burger[aria-expanded="true"] i:nth-child(3){width:100%;transform:translateY(-7px) rotate(-45deg)}

/* open + hover: THIS is the rotation */
.sb-burger[aria-expanded="true"]:hover .bars,
.sb-burger[aria-expanded="true"]:focus-visible .bars{transform:rotate(360deg)}

.sb-burger:focus-visible{outline:2px solid var(--electric);outline-offset:2px;border-radius:10px}

/* ---------------- scrim ---------------- */
.sb-scrim{
  position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);
  opacity:0;visibility:hidden;
  transition:opacity .38s var(--out),visibility 0s .38s;
}
.sb-scrim.is-open{opacity:1;visibility:visible;transition:opacity .38s var(--in),visibility 0s 0s}

/* ---------------- the drawer ---------------- */
.sb-drawer{
  font-family:var(--font-ui);
  position:fixed;z-index:80;
  top:14px;right:14px;bottom:14px;
  width:min(420px, calc(100vw - 28px));
  background:var(--panel);
  border-radius:24px;
  display:flex;flex-direction:column;
  padding:20px 22px 24px;
  box-shadow:0 40px 90px -30px rgba(0,0,0,.85);
  transform:translateX(calc(100% + 20px));
  visibility:hidden;
  transition:transform .38s var(--out),visibility 0s .38s;
  overflow-y:auto;overscroll-behavior:contain;
}
.sb-drawer.is-open{
  transform:translateX(0);
  visibility:visible;
  transition:transform .46s var(--in),visibility 0s 0s;
}

.sb-drawer-top{min-height:46px}   /* clearance for the burger sitting over the panel */
.sb-close{
  margin-left:auto;width:42px;height:42px;display:grid;place-items:center;
  background:none;border:1px solid var(--line);border-radius:12px;
  color:#D8DAE0;cursor:pointer;
  transition:background .3s var(--in),color .3s var(--in),border-color .3s var(--in);
}
.sb-close:hover{background:var(--panel-2);color:#fff;border-color:#4A4A4F}
.sb-close:focus-visible{outline:2px solid var(--electric);outline-offset:2px}

/* account block */
.sb-account{margin-top:26px}
.sb-account p{
  margin:0 0 14px;font-size:15px;line-height:1.5;color:var(--ash);font-weight:400;
}
.sb-cta{
  display:flex;align-items:center;justify-content:center;
  width:100%;min-height:64px;padding:0 20px;
  background:#fff;color:#0A0A0A;border:0;border-radius:16px;
  font-family:inherit;font-size:15px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;text-decoration:none;cursor:pointer;
  transition:transform .4s var(--in),background .3s ease;
}
.sb-cta:hover{background:#EDEEF2;transform:translateY(-2px)}
.sb-cta.is-blue{background:var(--electric);color:#fff}
.sb-cta.is-blue:hover{background:#2A4AFF}

.sb-rule{height:1px;background:var(--line);margin:26px 0 6px;border:0}

/* the link list */
.sb-links{display:flex;flex-direction:column;padding:0;margin:0;list-style:none}
.sb-links a{
  display:block;
  padding:15px 0;color:#F2F3F6;text-decoration:none;
  font-size:21px;font-weight:400;letter-spacing:-.01em;
  transition:color .3s var(--in);
}
/* the rule is drawn under the WORDS only, not the full row, so it has to
   live on an inner span — a flex row would stretch it edge to edge */
.sb-links .txt{position:relative;display:inline-block}
.sb-links .txt::after{
  content:"";position:absolute;left:0;right:0;bottom:-4px;height:2px;
  background:currentColor;border-radius:2px;
  transform:scaleX(0);transform-origin:left center;
  transition:transform .34s var(--in);
}
.sb-links a:hover .txt::after,
.sb-links a:focus-visible .txt::after{transform:scaleX(1)}
.sb-links a:hover{color:#fff}
.sb-links a:focus-visible{outline:2px solid var(--electric);outline-offset:4px;border-radius:6px}

/* pinned footer */
.sb-foot{margin-top:auto;padding-top:34px}
/* get-in-touch block: quiet label, the address carrying the weight */
.sb-touch{font-family:var(--font-ui)}
.sb-touch span{
  display:block;font-size:15px;line-height:1.4;color:var(--ash);
  font-weight:400;letter-spacing:0;text-transform:none;margin-bottom:6px;
}
.sb-touch a{
  position:relative;display:inline-block;
  color:#fff;text-decoration:none;
  font-size:21px;font-weight:500;letter-spacing:-.012em;line-height:1.25;
}
.sb-touch a::after{
  content:"";position:absolute;left:0;right:0;bottom:-4px;height:2px;
  background:currentColor;border-radius:2px;
  transform:scaleX(0);transform-origin:left center;transition:transform .34s var(--in);
}
.sb-touch a:hover::after,
.sb-touch a:focus-visible::after{transform:scaleX(1)}

/* light skin, if you'd rather match the cart drawer */
.sb-drawer.is-light{background:#FAFAFA;color:#18181B}
.sb-drawer.is-light .sb-close{border-color:#E4E4E7;color:#52525B}
.sb-drawer.is-light .sb-close:hover{background:#F0F0F1;color:#000}
.sb-drawer.is-light .sb-account p{color:#71717A}
.sb-drawer.is-light .sb-cta{background:#0A0A0A;color:#fff}
.sb-drawer.is-light .sb-rule{background:#E4E4E7}
.sb-drawer.is-light .sb-links a{color:#18181B}
.sb-drawer.is-light .sb-touch a{color:#18181B}

@media(max-width:560px){
  .sb-drawer{top:10px;right:10px;bottom:10px;width:calc(100vw - 20px);padding:16px 18px 20px}
  .sb-links a{font-size:20px;padding:14px 0}
  .sb-nav-r .sb-link{display:none}
}
@media(prefers-reduced-motion:reduce){
  .sb-drawer,.sb-scrim,.sb-burger i,.sb-burger .bars,.sb-links .txt::after{transition-duration:.001s!important}
}

/* demo hero behind */
.hero{height:100vh;display:grid;place-items:center;
  background:radial-gradient(120% 90% at 50% 0%,#1a1d2e,#000 62%)}
.hero p{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.3em;
  text-transform:uppercase;color:#33363F}
</style>
</head>
<body>

<header class="sb-header">
  <nav class="sb-nav-l">
    <a class="sb-link" href="/collections/all">Shop <span class="caret">&#9660;</span></a>
    <a class="sb-link" href="#">Collections <span class="caret">&#9660;</span></a>
  </nav>
  <nav class="sb-nav-r">
    <a class="sb-link" href="/pages/our-story">Our Story</a>
    <a class="sb-link" href="/cart">Cart (0)</a>
    <button class="sb-burger" id="sbBurger" type="button"
            aria-label="Open menu" aria-expanded="false" aria-controls="sbDrawer">
      <span class="bars"><i></i><i></i><i></i></span>
    </button>
  </nav>
</header>

<div class="sb-scrim" id="sbScrim"></div>

<aside class="sb-drawer" id="sbDrawer" role="dialog" aria-modal="true" aria-label="Menu">

  <div class="sb-drawer-top"></div>

  <div class="sb-account">
    <p>To access account and manage orders</p>
    <a class="sb-cta" href="/account/login">Login / Signup</a>
  </div>

  <hr class="sb-rule">

  <ul class="sb-links">
    <li><a href="/pages/track-your-order"><span class="txt">Track your order</span></a></li>
    <li><a href="/policies/refund-policy"><span class="txt">Returns &amp; Exchanges</span></a></li>
    <li><a href="/pages/support"><span class="txt">Support</span></a></li>
    <li><a href="/blogs/news"><span class="txt">Blog</span></a></li>
    <li><a href="/pages/faq"><span class="txt">FAQ</span></a></li>
  </ul>

  <div class="sb-foot">
    <div class="sb-touch">
      <span>Get in touch</span>
      <a href="mailto:hello@spiritbeing.in">hello@spiritbeing.in</a>
    </div>
  </div>
</aside>

<main class="hero"><p>Page content</p></main>

<script>
(function () {
  var burger = document.getElementById('sbBurger');
  var drawer = document.getElementById('sbDrawer');
  var scrim  = document.getElementById('sbScrim');
  var isOpen = false, lastFocus = null;

  var FOCUSABLE = 'a[href],button:not([disabled]),input,select,textarea,[tabindex]:not([tabindex="-1"])';

  function open(){
    if (isOpen) return;
    isOpen = true;
    lastFocus = document.activeElement;
    drawer.classList.add('is-open');
    scrim.classList.add('is-open');
    burger.setAttribute('aria-expanded','true');
    burger.setAttribute('aria-label','Close menu');
    document.body.classList.add('menu-open');
    setTimeout(function(){ burger.focus(); }, 60);
  }

  function close(){
    if (!isOpen) return;
    isOpen = false;
    drawer.classList.remove('is-open');
    scrim.classList.remove('is-open');
    burger.setAttribute('aria-expanded','false');
    burger.setAttribute('aria-label','Open menu');
    document.body.classList.remove('menu-open');
    if (lastFocus) lastFocus.focus();
  }

  burger.addEventListener('click', function(){ isOpen ? close() : open(); });
  scrim.addEventListener('click', close);

  document.addEventListener('keydown', function(e){
    if (!isOpen) return;
    if (e.key === 'Escape'){ close(); return; }
    if (e.key !== 'Tab') return;
    /* keep tabbing inside the drawer while it's open */
    /* the burger lives outside the panel but is part of the dialog */
    var items = [burger].concat([].slice.call(drawer.querySelectorAll(FOCUSABLE)));
    if (!items.length) return;
    var first = items[0], last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  });

  window.sbMenu = { open: open, close: close };
})();
</script>
</body>
</html>

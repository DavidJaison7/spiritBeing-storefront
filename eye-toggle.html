<label class="pw">
  <input type="password" placeholder="Password" autocomplete="current-password">
  <button class="pw-toggle" type="button" aria-label="Show password" aria-pressed="false"></button>
</label>

<style>
.pw{position:relative;display:block}
.pw input{
  width:100%;height:58px;padding:0 56px 0 20px;
  font:400 15px/1 system-ui,sans-serif;color:#18181B;
  background:#FAFAFA;border:1px solid #E4E4E7;border-radius:14px;outline:none;
}
.pw input:focus{border-color:#1B3CF5;box-shadow:0 0 0 3px rgba(27,60,245,.12)}
.pw-toggle{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:40px;height:40px;display:grid;place-items:center;
  background:none;border:0;border-radius:10px;cursor:pointer;color:#6B6B73;padding:0;
}
.pw-toggle:hover{color:#18181B;background:rgba(0,0,0,.045)}
.pw-toggle svg{display:block;overflow:visible}
.pw-toggle .lid,.pw-toggle .lash,.pw-toggle .pupil{
  fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
}
</style>

<script>
(function () {
  var DUR = 300;

  /* Both states are the same path structure: a move plus two cubics.
     Open, the curves bow apart into an almond. Closed, the second curve
     retraces the first, collapsing the shape onto a single lid arc.
     Outline is 20 x 13.05 -> ratio 1.53, which is what leaves room
     around the iris. */
  var OPEN   = [2,12,    5.6,3.3,   18.4,3.3,   22,12,    18.4,20.7,  5.6,20.7,  2,12  ];
  var CLOSED = [2,11.8,  5.6,17.4,  18.4,17.4,  22,11.8,  18.4,17.4,  5.6,17.4,  2,11.8];
  var PUPIL_R = 3.2;
  var LASHES = [[6.1,14.9, 4.7,17.2], [12,16, 12,18.4], [17.9,14.9, 19.3,17.2]];

  var NS = 'http://www.w3.org/2000/svg';
  var clamp = function (x) { return x < 0 ? 0 : x > 1 ? 1 : x; };
  var ease  = function (x) { return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x+2, 3)/2; };

  function toPath(p) {
    return 'M' + p[0] + ',' + p[1] +
           'C' + p[2] + ',' + p[3] + ' ' + p[4] + ',' + p[5] + ' ' + p[6] + ',' + p[7] +
           'C' + p[8] + ',' + p[9] + ' ' + p[10] + ',' + p[11] + ' ' + p[12] + ',' + p[13];
  }

  function build(size) {
    var svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('width', size);
    svg.setAttribute('height', size);
    svg.setAttribute('aria-hidden', 'true');

    var lid = document.createElementNS(NS, 'path');
    lid.setAttribute('class', 'lid');

    var pupil = document.createElementNS(NS, 'circle');
    pupil.setAttribute('class', 'pupil');
    pupil.setAttribute('cx', 12);
    pupil.setAttribute('cy', 12);

    svg.appendChild(lid);
    svg.appendChild(pupil);

    var lashes = LASHES.map(function (L) {
      var el  = document.createElementNS(NS, 'path');
      var len = Math.hypot(L[2] - L[0], L[3] - L[1]);
      el.setAttribute('class', 'lash');
      el.setAttribute('d', 'M' + L[0] + ',' + L[1] + 'L' + L[2] + ',' + L[3]);
      el.setAttribute('stroke-dasharray', len);
      el.dataset.len = len;
      svg.appendChild(el);
      return el;
    });

    return { svg: svg, lid: lid, pupil: pupil, lashes: lashes, raf: null };
  }

  /* t = 0 open (readable) ... t = 1 closed (private) */
  function paint(g, t) {
    var out = [], i;
    for (i = 0; i < OPEN.length; i++) out.push(OPEN[i] + (CLOSED[i] - OPEN[i]) * t);
    g.lid.setAttribute('d', toPath(out));

    var p = clamp(t / 0.45);                       // iris is gone by 45%
    g.pupil.setAttribute('r', Math.max(0.001, PUPIL_R * (1 - p)));
    g.pupil.setAttribute('cy', 12 + t * 2.6);      // rides down with the lid
    g.pupil.style.opacity = 1 - p;

    g.lashes.forEach(function (el, n) {            // lashes draw in over the back half
      var start = 0.52 + (n === 1 ? 0 : 0.06);
      var k = clamp((t - start) / (1 - start));
      el.setAttribute('stroke-dashoffset', el.dataset.len * (1 - k));
      el.style.opacity = k;
    });
  }

  function animate(g, from, to) {
    if (g.raf) cancelAnimationFrame(g.raf);
    var t0 = performance.now();
    (function step(now) {
      var k = clamp((now - t0) / DUR);
      paint(g, from + (to - from) * ease(k));
      if (k < 1) g.raf = requestAnimationFrame(step);
    })(t0);
  }

  document.querySelectorAll('.pw-toggle').forEach(function (btn) {
    var input   = btn.parentNode.querySelector('input');
    var g       = build(22);
    var visible = false;                           // starts hidden -> lid closed

    btn.appendChild(g.svg);
    paint(g, 1);

    btn.addEventListener('click', function () {
      visible = !visible;
      animate(g, visible ? 1 : 0, visible ? 0 : 1);

      var s = input.selectionStart, e = input.selectionEnd;   // type swap resets the caret
      input.type = visible ? 'text' : 'password';
      try { input.setSelectionRange(s, e); } catch (err) {}
      input.focus();

      btn.setAttribute('aria-pressed', String(visible));
      btn.setAttribute('aria-label', visible ? 'Hide password' : 'Show password');
    });
  });
})();
</script>
